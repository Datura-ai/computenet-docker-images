name: build-smoke

# Every template's bake file resolves on every PR; every template the PR touches is built (one target) and booted:
# python3 (/workspace is reported, not required), `import torch` for the `pytorch` template, the template's own smoke.sh when present. On a GPU
# host (`E2E_GPU=1 scripts/build-smoke.sh <template>`, run by the loop on a Lium pod) the same script also requires
# nvidia-smi inside every container and torch.cuda where torch imports. Nothing is pushed: images are tagged lium-smoke/<template> and
# removed. A push to master only resolves the bake files (its diff against origin/master is empty). Stable job name so it can be required.
# Each build pulls its base images first (3 tries, each capped at T_PULL=8m and leftover T_PULL_TOTAL / tries left —
# a stalled first connection cannot spend the whole 25 minutes, DAH-3409)
# and writes its full log to artifacts/build-<template>.log, kept by the upload below even when the step times out.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      templates:
        description: "space-separated template names to build (default: those changed)"
        default: ""

# The smoke boots PR-built DinD images --privileged, which owns the runner: that job's GITHUB_TOKEN reads metadata only,
# and it gets no secrets and no stored git credentials. Only the comment job, on its own runner that boots nothing the
# PR built, can write to the PR. It checks out nothing and restores no smoke artifact: the smoke hands it summary.md as
# a base64 job output, which its script decodes from an env var and posts as text. In the comment job a poisoned image
# can still choose the comment's words or stop it from being posted, nothing more.
permissions: {}

jobs:
  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      summary: ${{ steps.summary.outputs.base64 }}   # kept when only the comment job is re-run, on a later run_attempt
    concurrency:
      group: build-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a superseded PR push cancels the old run; master runs finish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker   # the engine's own builder: --load is free (the docker-container driver re-imports the image as a tarball)
      - name: room for a CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: self-test — a missing Dockerfile and an unknown template name must fail the script
        run: |
          mv templates/ubuntu/Dockerfile /tmp/ubuntu.Dockerfile
          out=$(BASE=HEAD scripts/build-smoke.sh 2>&1) && { echo "$out"; echo "a hidden Dockerfile did not fail the check"; exit 1; }
          mv /tmp/ubuntu.Dockerfile templates/ubuntu/Dockerfile
          grep -q "missing Dockerfile for target(s): ubuntu2404" <<<"$out"
          out=$(scripts/build-smoke.sh nosuch 2>&1) && { echo "$out"; echo "an unknown template did not fail the check"; exit 1; }
          grep -q "templates/nosuch has no docker-bake.hcl" <<<"$out"
          # the pre-pull list: better-a1111's Dockerfile has four FROM lines, three of them stage references (`base`, `a1111-install` twice) —
          # exactly one registry image must come out, and it must be a `${BASE_IMAGE}` that resolved to a repo:tag, not the literal
          bases=$(scripts/build-smoke.sh --bases better-a1111) || { echo "--bases failed"; exit 1; }
          [ "$(wc -l <<<"$bases")" -eq 1 ] || { printf 'stage aliases leaked into the pull list:\n%s\n' "$bases"; exit 1; }
          grep -Eq '^[a-z0-9./-]+:[A-Za-z0-9._-]+$' <<<"$bases" || { echo "not an image reference: $bases"; exit 1; }
          rm -rf artifacts
      - name: bake --print every template; build + boot the changed ones
        id: smoke
        timeout-minutes: 85
        env:
          BASE: origin/${{ github.event.pull_request.base.ref || 'master' }}
          TEMPLATES: ${{ github.event.inputs.templates }}
        run: scripts/build-smoke.sh $TEMPLATES
      - id: artifact
        if: always()
        run: echo "name=build-smoke-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - id: summary
        if: always()   # base64 keeps it one line (summary.md cannot add output lines); a PR comment holds 65536 characters
        run: echo "base64=$( [ -f artifacts/summary.md ] && head -c 60000 artifacts/summary.md | base64 -w0 )" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts
          retention-days: 14

  comment:
    name: build-smoke result on the PR
    needs: build-smoke
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # post or update the result comment; the only scope in this workflow
    steps:
      - name: result on the PR
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          OUTCOME: ${{ needs.build-smoke.result }}
          SUMMARY_B64: ${{ needs.build-smoke.outputs.summary }}   # untrusted: read as data, never put into the script
        with:
          script: |
            const marker = '<!-- build-smoke -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = Buffer.from(process.env.SUMMARY_B64 || '', 'base64').toString('utf8')
              || `**image smoke: FAIL** — no summary written (outcome ${process.env.OUTCOME}); see the run log.`;
            const body = [marker, `### image smoke · ${context.payload.pull_request.head.sha.slice(0, 8)} · [run](${runUrl})`, '', summary.trim(), '',
              '<sub>bake --print of every template; build + boot of the templates this PR touches (scripts/build-smoke.sh). GPU check: `E2E_GPU=1 scripts/build-smoke.sh <template>` on a GPU host.</sub>'].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
