name: build-smoke

# Every template's bake file resolves on every PR; every template the PR touches is built (one target) and booted:
# python3, /workspace, `import torch` for the PyTorch images, the template's own smoke.sh when present. On a GPU
# host (`E2E_GPU=1 scripts/build-smoke.sh pytorch`, run by the loop on a Lium pod) the same script also requires
# nvidia-smi and torch.cuda inside the container. Nothing is pushed: images are tagged lium-smoke/<template> and
# removed. Stable job name so it can be required.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      templates:
        description: "space-separated template names to build (default: those changed)"
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: build-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: room for a CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: bake --print every template; build + boot the changed ones
        id: smoke
        timeout-minutes: 85
        env:
          BASE: origin/${{ github.event.pull_request.base.ref || 'master' }}
        run: scripts/build-smoke.sh ${{ github.event.inputs.templates }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-smoke-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 14
      - name: result on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- build-smoke -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = fs.existsSync('artifacts/summary.md') ? fs.readFileSync('artifacts/summary.md', 'utf8')
              : `**image smoke: FAIL** — no summary written (outcome ${process.env.OUTCOME}); see the run log.`;
            const body = [marker, `### image smoke · ${context.payload.pull_request.head.sha.slice(0, 8)} · [run](${runUrl})`, '', summary.trim(), '',
              '<sub>bake --print of every template; build + boot of the templates this PR touches (scripts/build-smoke.sh). GPU check: `E2E_GPU=1 scripts/build-smoke.sh <template>` on a GPU host.</sub>'].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
